<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Android Adaptive squircle container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Geometric Kite / Finance Shape -->
  <g filter="url(#dropGlow)" transform="translate(256, 256)">
    <!-- Upward trajectory dynamic wings -->
    <path d="M 0,-140 L 110,-10 L 0,140 L -110,-10 Z" fill="url(#accentGrad)" />
    <!-- Center fold / faceted reflection -->
    <path d="M 0,-140 L 110,-10 L 0,140 Z" fill="#ffffff" fill-opacity="0.18" />
    <!-- Currency slash / upward swipe line -->
    <path d="M -70,20 L 70,-70" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
  </g>
  
  <!-- Subtle touch swipe gesture indicator trail -->
  <path d="M 170,410 C 220,385 292,385 342,410" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
